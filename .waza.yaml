tokens:
  # APM 公式推奨 (SKILL.md ≤ 5000 tokens) を warning 閾値として採用。
  # 旧 2500 は project workflow を持つ skill では非現実的 (全 SKILL.md が warning 化) だったため引き上げ。
  warningThreshold: 5000
  fallbackLimit: 2000
  limits:
    defaults:
      # APM (Microsoft) 推奨: SKILL.md は 500 lines / 5000 tokens
      # https://microsoft.github.io/apm/producer/author-primitives/skills/
      "SKILL.md": 5000
      # references / agents / その他は waza built-in default ベース
      "references/*.md": 1000
      "references/**/*.md": 1000
      "agents/*.md": 1000
      "agents/**/*.md": 1000
      "*.md": 2000
    overrides:
      "README.md": 3000
      # 各 skill の現状を許容する override (500 token 単位で切り上げ)。
      # 改善が進んだら値を下げる方針。
      # --- SKILL.md ---
      # 圧縮済み。default 5000 に収まる skill はここに列挙しない。
      "skills/usage-guide/SKILL.md": 5500
      # --- tech-blog-from-docs/references ---
      "skills/tech-blog-from-docs/references/self-review.md": 10000
      "skills/tech-blog-from-docs/references/japanese-writing.md": 6000
      "skills/tech-blog-from-docs/references/prep-and-structure.md": 5500
      # --- thinking-partner-for-docs/references ---
      "skills/thinking-partner-for-docs/references/preparation-questions.md": 2000
      "skills/thinking-partner-for-docs/references/stakeholder-lenses.md": 2000
      # --- worksample-question-generator/references ---
      "skills/worksample-question-generator/references/question-perspectives.md": 3500
      # --- book-translation-pipeline/references ---
      "skills/book-translation-pipeline/references/pipeline-customization.md": 14000
      "skills/book-translation-pipeline/references/proof-checklists.md": 11000
      "skills/book-translation-pipeline/references/templates.md": 6000
      # --- book-translation-pipeline/agents ---
      "skills/book-translation-pipeline/agents/proof-en-ja-agent.md": 2500
      "skills/book-translation-pipeline/agents/proof-epub-en-agent.md": 2000
      "skills/book-translation-pipeline/agents/translation-agent.md": 2000
