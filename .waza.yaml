      # APM (Microsoft) 推奨: SKILL.md は 500 lines / 5000 tokens
      # https://microsoft.github.io/apm/producer/author-primitives/skills/
      "SKILL.md": 5000
      # references / agents / その他は waza built-in default ベース
      "references/*.md": 1000
      "references/**/*.md": 1000
      "agents/*.md": 1000
      "agents/**/*.md": 1000
      "*.md": 2000
    overrides:
      "README.md": 3000
