name: Waza Eval

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.github/workflows/waza-eval.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.github/workflows/waza-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Run waza on all skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install waza
        run: |
          go install github.com/microsoft/waza/cmd/waza@latest
          waza --version

      - name: waza check (compliance — advisory)
        continue-on-error: true
        run: waza check

      - name: waza run (mock executor)
        run: waza run --output-dir results --transcript-dir transcripts --verbose

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waza-evaluation-results
          path: |
            results/
            transcripts/
          retention-days: 30
          if-no-files-found: warn
