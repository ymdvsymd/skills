name: Waza Eval

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.github/workflows/waza-eval.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.github/workflows/waza-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Run waza on all skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install waza
        run: |
          go install github.com/microsoft/waza/cmd/waza@latest
          waza --version

      - name: waza check (compliance — advisory)
        if: always()
        continue-on-error: true
        run: waza check

      - name: waza tokens check (token budget gate)
        run: waza tokens check --strict

      - name: waza check schema + links + advisory regression gate
        # Gated advisories must stay passing for every skill. The remaining
        # advisories (complexity / module-count / cross-model-density) are
        # accepted as failing by design and intentionally not gated here.
        env:
          GATED_ADVISORIES: '["over-specificity","procedural-content","body-structure"]'
        run: |
          set -e
          waza check --format json > check.json
          if ! jq -e '[.skills[] | select(.schema.valid == false)] | length == 0' check.json > /dev/null; then
            echo "::error::eval.yaml schema validation failed"
            jq '.skills[] | select(.schema.valid == false) | {name, errors: .schema.evalErrors}' check.json
            exit 1
          fi
          if ! jq -e '[.skills[] | select((.links.orphanedFiles // []) | length > 0)] | length == 0' check.json > /dev/null; then
            echo "::error::orphaned reference files detected"
            jq '.skills[] | select((.links.orphanedFiles // []) | length > 0) | {name, orphaned: .links.orphanedFiles}' check.json
            exit 1
          fi
          if ! jq -e --argjson gated "$GATED_ADVISORIES" '[.skills[] | .advisoryChecks[] | select(.name as $n | $gated | index($n)) | select(.passed == false)] | length == 0' check.json > /dev/null; then
            echo "::error::a gated advisory regressed (over-specificity / procedural-content / body-structure must stay passing)"
            jq --argjson gated "$GATED_ADVISORIES" '.skills[] | {name, regressed: [.advisoryChecks[] | select(.name as $n | $gated | index($n)) | select(.passed == false) | {name, summary}]} | select(.regressed | length > 0)' check.json
            exit 1
          fi

      - name: waza run (mock executor)
        run: waza run --output-dir results --transcript-dir transcripts --verbose

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: waza-evaluation-results
          path: |
            results/
            transcripts/
          retention-days: 30
          if-no-files-found: warn
